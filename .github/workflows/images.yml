name: images

# Builds the workspace images in images/ and pushes them to GitHub Container Registry.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ml-base, ml-gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the PyTorch image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          load: true
          tags: ghcr.io/gpuhubs/${{ matrix.image }}:1

      # The same limits a rented workspace has: no network, read-only, not root.
      - name: Check it works the way a workspace runs it
        run: |
          docker run --rm --network none --read-only --user 1000:1000 --cap-drop ALL \
            --tmpfs /workspace:rw,exec,size=512m,uid=1000,gid=1000 --env HOME=/workspace --workdir /workspace \
            ghcr.io/gpuhubs/${{ matrix.image }}:1 python -c "
          import numpy, pandas, scipy, sklearn, matplotlib
          matplotlib.use('Agg')
          if '${{ matrix.image }}' == 'ml-gpu':
              import torch, transformers, accelerate, safetensors, sentencepiece
              x = torch.randn(64, 64)
              assert float((x @ x).abs().sum()) > 0
              print('torch', torch.__version__, 'transformers', transformers.__version__)
          print('imports ok')
          "

      - name: Push
        run: docker push ghcr.io/gpuhubs/${{ matrix.image }}:1
